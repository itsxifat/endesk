# EnDesk: download page + installers, and the signaling relay (systemd endesk-relay).
# Installed once by deploy/server-setup.sh; certbot then adds TLS to this file, so
# later edits are made on the server by hand (backup, nginx -t, reload).

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    root /var/www/endesk;
    index index.html;

    # WebSocket signaling for the apps.
    location = /relay {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # The relay trusts this from loopback only (per-network rate limits).
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:__PORT__/health;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Stable names (EnDesk-Setup.exe, EnDesk-mac.dmg, ...) are symlinks to the
    # current version, so they must not be cached.
    location /downloads/ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
